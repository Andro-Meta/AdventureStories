# GitHub CodeQL static analysis. Runs on push, PR, and weekly cron so any
# new code paths are scanned even if no commits land for a while. Free for
# public repos. Findings show up under the repo's Security tab.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'  # Mondays 06:17 UTC
  workflow_dispatch:  # run by hand (Actions tab, or: gh workflow run CodeQL)

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'python']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # mobile/www and the Android assets are copies of the root files
          # (node mobile/sync-web.mjs): scanning them doubled every alert.
          config: |
            paths-ignore:
              - mobile/www
              - mobile/android/app/src/main/assets
          # Default queries cover the most useful security + correctness rules.
          # `security-and-quality` adds maintainability lints on top.
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
